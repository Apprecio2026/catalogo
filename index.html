<!-- HEADER RED APPRECIO -->
<header class="bg-[#fa335e] px-6 py-3 flex items-center justify-between shadow-md">
  
  <!-- Marca: Píldora Negra Sobria con Imagen del Logo -->
  <div class="bg-slate-950 px-5 py-2 rounded-full flex items-center justify-center shadow-lg border border-slate-800">
    <img 
      src="banner-apprecio.png.png" 
      alt="Apprecio Banner Logo" 
      class="h-8 w-auto object-contain"
    />
  </div>

  <!-- Botones de Sincronización en Negro Traslúcido con Detalles Blancos -->
  <div class="flex items-center space-x-3">
    <button class="bg-black/20 hover:bg-black/35 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center space-x-2 backdrop-blur-sm border border-white/10 transition-all active:scale-95">
      <svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24">
        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
      </svg>
      <span>Sincronizar Datos</span>
    </button>
  </div>

</header>

<!-- BANNER PRINCIPAL APPRECIO -->
<section class="bg-slate-50 border-b-2 border-[#fa335e] py-12 px-6">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
    
    <!-- Contenido Textual -->
    <div class="flex-1 space-y-4">
      <div class="inline-block bg-slate-950 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
        Novedad Apprecio
      </div>
      <h1 class="text-3xl md:text-5xl font-extrabold text-slate-950 leading-tight">
        Gestiona tus beneficios e incentivos de forma simple
      </h1>
      <p class="text-slate-600 text-base md:text-lg">
        La plataforma integral para conectar, motivar y recompensar a tu equipo de trabajo sin fricciones.
      </p>
      
      <!-- Botones de Acción (CTA) -->
      <div class="flex flex-wrap gap-4 pt-2">
        <a href="#" class="bg-[#fa335e] hover:bg-[#e0264f] text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition-all">
          Comenzar Ahora
        </a>
        <a href="#" class="bg-slate-200 hover:bg-slate-300 text-slate-950 font-semibold px-6 py-3 rounded-xl transition-all">
          Saber más
        </a>
      </div>
    </div>

    <!-- Recursos Visuales del Banner -->
    <div class="flex-1 flex justify-center">
      <div class="relative w-full max-w-md bg-white p-6 rounded-2xl shadow-xl border border-slate-100 flex items-center justify-center min-h-[220px]">
        <span class="text-slate-400 font-medium text-sm">
          [ Espacio para Ilustración / Producto ]
        </span>
      </div>
    </div>

  </div>
</section>
